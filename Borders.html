<!--CSS borders define the outline around an HTML element, providing visual separation and emphasis within a webpage layout.-->
<!--The border property in CSS allows you to customize the width, style, and color of the border around an element.-->
<!--Common border styles include solid, dashed, dotted, double, groove, ridge, inset, and outset.-->

<!--Example.1-->
<!--This example demonstrates a solid border around a div element.-->
<div style="border: 2px solid black; padding: 10px; width: 200px; text-align: center;">
  Solid Border Example
</div>  

<!--Example.2-->
<!--This example demonstrates a dashed border around a div element.-->
<div style="border: 2px dashed blue; padding: 10px; width: 200px; text-align: center;">
  Dashed Border Example </div>

<!--Example.3-->
<!--This example demonstrates a dotted border around a div element.-->
<div style="border: 2px dotted red; padding: 10px; width: 200px; text-align: center;">
  Dotted Border Example </div>

<!--Example.4-->
<!--This example demonstrates a double border around a div element.-->
<div style="border: 4px double green; padding: 10px; width: 200px; text-align: center;">
  Double Border Example </div>

<!--Example.5-->
<!--This example demonstrates a groove border around a div element.-->  
<div style="border: 4px groove orange; padding: 10px; width: 200px; text-align: center;">
  Groove Border Example </div>

<!--Example.6-->
<!--This example demonstrates a ridge border around a div element.--> 
<div style="border: 4px ridge purple; padding: 10px; width: 200px; text-align: center;">
  Ridge Border Example </div>
