<!--CSS margins are used to create space outside an element’s border, helping to separate it from other elements on a webpage-->

<!--The margin property in CSS allows you to set the space around an element, which can be specified in pixels, percentages, or other units.-->

<!--Common margin values include auto, which centers an element horizontally, and specific values for top, right, bottom, and left margins.-->

<!--Example.1-->
<a href="#" style="margin: 20px; display: inline-block; background-color: lightgray; padding: 10px; text-decoration: none;">
  Margin Example 1
</a>
